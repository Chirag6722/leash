[package]
name = "leash-prove"
version = "0.1.0"
edition = "2021"
description = "Proves the leash's floor for every possible request with Cedar's symbolic compiler and an SMT solver."
publish = false

[dependencies]
cedar-policy = "4"
cedar-policy-symcc = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
anyhow = "1"
